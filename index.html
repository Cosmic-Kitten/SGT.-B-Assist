<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>SGT. B-Assist — Microsoft Teams AI Interviewer</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="SGT. B-Assist home">
          <span class="brand-mark">B</span>
          <span>SGT. B-Assist</span>
        </a>
        <div class="workspace-label">TEAMS INTERVIEWER</div>
        <nav class="nav-list" aria-label="Main navigation">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
          <button class="nav-item" data-view="interviews"><span class="nav-icon">◷</span>Teams Meetings <span class="nav-count">3</span></button>
          <button class="nav-item" data-view="questionnaires"><span class="nav-icon">▤</span>Teams Bot Scripts</button>
          <button class="nav-item" data-view="candidates"><span class="nav-icon">⇢</span>Teams Consent & Ethics <span class="nav-count warn">1</span></button>
          <button class="nav-item" data-view="transcripts"><span class="nav-icon">▧</span>Teams Call Transcripts</button>
          <button class="nav-item" data-view="bot-config"><span class="nav-icon">⚙</span>Microsoft Teams Bot Settings</button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="connection-card">
          <div class="connection-title"><span class="status-dot offline"></span>Teams Bot Offline</div>
          <p>Local Teams simulation active. Connect Microsoft Graph Bot Framework.</p>
          <button class="text-button" data-view="bot-config">Configure Teams Bot <span>→</span></button>
        </div>
        <button class="profile" data-view="bot-config">
          <span class="avatar">SB</span>
          <span class="profile-copy"><strong>Sara Boudoin</strong><small>Teams Interviewer Lead</small></span>
          <span class="profile-menu">···</span>
        </button>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Toggle menu">☰</button>
          <div class="breadcrumb">SGT. B-Assist <span>/</span> <strong id="crumb">Dashboard</strong></div>
          <div class="topbar-actions">
            <span class="preview-chip"><span></span>MS TEAMS AI INTERVIEWER</span>
            <button class="icon-button" aria-label="Notifications" data-view="candidates">♧<i></i></button>
          </div>
        </header>
        <section class="content" id="content" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
